[importlinter]
root_package = redrobin
include_external_packages = True

[importlinter:contract:layers]
name = Layered Architecture
type = layers
layers =
    api | tui
    application
    domain
containers =
    redrobin

[importlinter:contract:no-infra-from-domain]
name = Domain never imports infrastructure
type = forbidden
source_modules =
    redrobin.domain
forbidden_modules =
    redrobin.infrastructure
    redrobin.application
    redrobin.api
    redrobin.tui

[importlinter:contract:no-presentation-from-application]
name = Application never imports presentation
type = forbidden
source_modules =
    redrobin.application
forbidden_modules =
    redrobin.api
    redrobin.tui

[importlinter:contract:no-direct-infra-from-presentation]
name = Presentation never imports infrastructure directly (must go via application)
type = forbidden
source_modules =
    redrobin.api
    redrobin.tui
forbidden_modules =
    redrobin.infrastructure
allow_indirect_imports = True
