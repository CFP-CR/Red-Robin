id: screenshot_persistent
match:
  command: screenwatch
severity: WARN
reason: 'screenwatch (persistent screenshot capture, T1113) is operator-visible to TS terminal services in some configurations and leaves a persistent screenshot directory in the beacon working folder. The compounding I/O signature (regular write bursts on a fixed cadence) is easy to baseline. Use sparingly.'
suggestions:
  - 'Single-shot `screenshot` is much lower-risk if you only need state at one moment'
  - 'Configure the screenwatch interval to a non-uniform cadence (avoid the default tight loop) to evade baselining'
  - 'Limit duration explicitly via `sleep` then `kill` — leaving screenwatch unattended is an OPSEC liability if the operator gets disconnected'
sources:
  - 'MITRE T1113 Screen Capture'
