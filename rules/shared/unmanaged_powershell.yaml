id: unmanaged_powershell
match:
  command: powershell
severity: WARN
reason: 'Direct powershell.exe invocation exposes the operator to AMSI (Antimalware Scan Interface) inspection of every script block, plus PowerShell Script Block Logging (EID 4104) which is enabled by default in modern domain policies. T1059.001. Defender real-time scanning will flag known offensive cmdlets, and EDR ETW providers (Microsoft-Windows-PowerShell) record everything.'
suggestions:
  - 'Use powerpick (CS) or an equivalent unmanaged PowerShell host — no powershell.exe spawn, no Script Block Logging in the conventional channel'
  - 'For one-shot logic, prefer a BOF over PowerShell entirely (no .NET runtime, no AMSI)'
  - 'If you must use powershell, apply an AMSI bypass first AND keep the script under 4 KB to reduce 4104 telemetry'
sources:
  - 'MITRE T1059.001 Command and Scripting Interpreter: PowerShell'
  - 'Microsoft Antimalware Scan Interface (AMSI)'
  - 'PowerShell EID 4104 (Script Block Logging)'
