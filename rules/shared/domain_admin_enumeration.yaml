id: domain_admin_enumeration
match:
  command: shell
  arg_pattern: '(?i)net\s+group\s+"?Domain Admins"?'
severity: WARN
reason: '`net group "Domain Admins" /domain` is the canonical "first 60 seconds" recon pattern that every blue-team analyst learns to grep for. T1069.002. It generates EID 4661 (object access on a Domain Admins group) which most modern SIEMs key on.'
suggestions:
  - 'Use a pre-collected BloodHound graph for group membership — zero on-host enumeration'
  - 'If you must query live, prefer Active Directory module (Get-ADGroupMember -Identity "Domain Admins") through unmanaged powershell with AMSI bypass'
  - 'Or use LDAP search via adsisearcher with non-obvious filters'
sources:
  - 'MITRE T1069.002 Permission Groups Discovery: Domain Groups'
  - 'Windows EID 4661 (object access)'
