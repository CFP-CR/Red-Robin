id: socks_external
match:
  command: socks
  arg_pattern: '\b(80|443|8080)\b'
severity: INFO
reason: 'Opening a SOCKS proxy on a well-known port (80/443/8080) sometimes works to blend into existing firewall rules, but those ports are also the most heavily inspected — TLS interception or DPI on egress paths can fingerprint the SOCKS5 handshake or tunneled traffic. T1572. A high-port (random ephemeral) tunnel attracts less proactive inspection on most enterprise networks.'
suggestions:
  - 'Pick a high port (e.g., 1080, or a random 30000+) that does not collide with deep-inspection rules'
  - 'If you need to egress through a content filter, prefer rportfwd over a host:443 path to the team server instead of SOCKS'
sources:
  - 'MITRE T1572 Protocol Tunneling'
