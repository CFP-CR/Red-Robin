id: runas_admin_creds
match:
  command: runas
  arg_pattern: '(?i)/user:.*(admin|administrator)'
severity: WARN
reason: 'runas with /user: targeting an admin account places the credential in cmdline (Sysmon EID 1, Defender ATP CommandLine capture). T1078. Even if the password is supplied interactively, the username + parent process + working directory triple is enough to pivot SOC attention to the host.'
suggestions:
  - 'Use `make_token <user> <password>` from inside the beacon — no cmdline exposure, no new process'
  - 'Or `pth` (pass-the-hash) if the NT hash is already known — same result, less telemetry'
  - 'If runas is unavoidable, prefer `runas /netonly` so the credential is used only for network logons (no interactive logon EID 4624 type 2)'
sources:
  - 'MITRE T1078 Valid Accounts'
  - 'Sysmon EID 1 (process create with cmdline)'
