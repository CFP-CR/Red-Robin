id: vssadmin_list_shadows
match:
  command: shell
  arg_pattern: '(?i)vssadmin\s+list\s+shadows'
severity: DANGER
reason: 'vssadmin list shadows is a textbook ransomware reconnaissance primitive (T1490 — Inhibit System Recovery family). Almost every SOC playbook treats vssadmin from an interactive logon as a hard alert; no legitimate operator workflow needs it.'
suggestions:
  - 'If you need shadow copy access for credential theft, mount the VSS snapshot directly via WMI Win32_ShadowCopy without invoking vssadmin'
  - 'For NTDS.dit extraction, prefer ntdsutil "ifm" or a DA-level dcsync (already documented as a separate technique)'
sources:
  - 'MITRE T1490 Inhibit System Recovery'
  - 'MITRE T1003.003 NTDS extraction (related)'
