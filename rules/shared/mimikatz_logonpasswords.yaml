id: mimikatz_logonpasswords
match:
  command: mimikatz
  arg_pattern: '(?i)sekurlsa::logonpasswords|logonpasswords'
severity: DANGER
reason: 'lsass touch + plaintext credential extraction matches T1003.001. Sysmon EID 10 and most EDRs (CrowdStrike, Defender, SentinelOne) flag this signature in real time.'
suggestions:
  - 'Use nanodump BOF (no lsass handle open via OpenProcess) — invisible to most EDR signatures'
  - 'Or Rubeus /tgtdeleg for Kerberos-only credential extraction'
  - 'Or harvest from process memory dump if file write is acceptable (T1003.001 sub-technique)'
sources:
  - 'MITRE T1003.001 OS Credential Dumping: LSASS Memory'
  - 'Sysmon EID 10 (Process accessed lsass.exe)'
