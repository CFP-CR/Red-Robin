id: nbtstat_arp_sweep
match:
  command: shell
  arg_pattern: '(?i)(nbtstat -an|arp -a)'
severity: INFO
reason: 'nbtstat -an / arp -a are passive-ish discovery primitives (T1018). They generate no over-the-wire scan traffic on their own, and the on-host telemetry (process create) is low-noise unless an EDR baseline flags `cmd.exe -> nbtstat` from an unusual parent. Generally safe but worth annotating.'
suggestions:
  - 'For broader discovery, prefer LDAP queries via adsisearcher (catches everything domain-joined) rather than ARP sweeps which only see L2-adjacent hosts'
  - 'If you need NetBIOS data, scope to a single subnet — broad nbtstat queries against multiple ranges look like worm behavior'
sources:
  - 'MITRE T1018 Remote System Discovery'
