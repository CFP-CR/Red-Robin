id: winrm_enable
match:
  command: shell
  arg_pattern: '(?i)winrm\s+quickconfig|Enable-PSRemoting'
severity: DANGER
reason: 'winrm quickconfig / Enable-PSRemoting opens TCP 5985/5986 and writes a persistent firewall rule + service start change. T1021.006. Blue teams treat new WinRM listeners on workstations as a strong lateral-movement indicator (EID 5985 from the WinRM service + 4946 firewall change).'
suggestions:
  - 'Avoid enabling WinRM if a workstation does not already have it on — use SMB / WMI / RDP for lateral movement instead'
  - 'If WinRM is necessary, confirm it is already enabled on the target (Test-WSMan) before invoking quickconfig'
  - 'Consider domain-wide GPO context: if WinRM is uniformly disabled by policy, an opt-in is a red flag for SOC review'
sources:
  - 'MITRE T1021.006 Remote Services: Windows Remote Management'
  - 'Windows EID 5985 (WinRM activity), EID 4946 (firewall rule added)'
