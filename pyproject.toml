[project]
name = "redrobin"
version = "0.1.0"
description = "AI red team companion with OPSEC pre-flight gate for Cobalt Strike"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "anthropic>=0.60.0",
    "voyageai>=0.3.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "python-ulid>=2.0",
    "prompt-toolkit>=3.0.40",
    "pypdf>=4.0",
    "watchdog>=4.0",
    "aiofiles>=23.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.11",
    "pre-commit>=3.7",
]

[project.scripts]
redrobin = "redrobin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redrobin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["redrobin/domain", "redrobin/application"]

[[tool.mypy.overrides]]
module = ["redrobin.infrastructure.*"]
disallow_untyped_defs = false  # gradual in infrastructure layer
