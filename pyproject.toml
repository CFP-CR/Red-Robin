[project]
name = "redrobin"
version = "0.1.0"
description = "AI red team companion with OPSEC pre-flight gate for Cobalt Strike"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "anthropic>=0.100.0",
    "voyageai>=0.3.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "python-ulid>=2.0",
    "prompt-toolkit>=3.0.40",
    "pypdf>=4.0",
    "watchdog>=4.0",
    "aiofiles>=23.0",
    "numpy>=1.26",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "textual>=8.2.7",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.11",
    "pre-commit>=3.7",
    "pytest-textual-snapshot>=1.0.0",
]

[project.scripts]
redrobin = "redrobin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redrobin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# A hung test must END the run, not wedge it. Several suites here talk to a WebSocket
# through starlette's TestClient, whose receive blocks on a memory stream with NO timeout
# and whose _run sleeps forever after the app returns -- so a frame that never arrives
# hangs the whole session rather than failing a test. pytest-timeout is not a dependency,
# so this is the built-in equivalent.
#
# BOTH lines are required. faulthandler_timeout alone only DUMPS tracebacks and lets the
# run keep hanging: faulthandler_exit_on_timeout is a separate ini that defaults to false
# (see _pytest/faulthandler.py). The budget is PER TEST, not per session -- pytest arms it
# in pytest_runtest_protocol, once per item -- and the whole suite of 735 runs in ~62s, so
# 300s for a single test can only mean a hang, never a slow machine.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["redrobin/domain", "redrobin/application"]

[[tool.mypy.overrides]]
module = ["redrobin.infrastructure.*"]
disallow_untyped_defs = false  # gradual in infrastructure layer
